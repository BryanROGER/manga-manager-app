name: CI Backend Java 21

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour SonarCloud (historique de git)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        # verify exécute les tests et génère le rapport JaCoCo
        run: mvn clean verify

      - name: Upload JaCoCo Report (Artifact)
        # Permet de télécharger le rapport HTML complet depuis l'onglet "Actions"
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: SonarCloud Scan
        # Utiliser Maven pour Sonar est plus fiable pour Java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \            
            -Dsonar.projectKey=BryanROGER_manga-manager-app \
            -Dsonar.organization=bryanroger \
            -Dsonar.host.url=https://sonarcloud.io